name: Build EXE
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin

    - name: Cache Gradle
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Cache vcpkg
      uses: actions/cache@v3
      with:
        path: C:/vcpkg
        key: vcpkg-${{ hashFiles('native/CMakeLists.txt') }}
        restore-keys: |
          vcpkg-

    - name: Build EXE
      run: .\gradlew.bat --no-daemon --parallel --build-cache dll

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: OpenNiloreLoader
        path: build/dist/OpenNiloreLoader.exe
